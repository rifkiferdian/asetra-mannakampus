<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>
            {{ if .Title }}
                {{ .Title }}
            {{ else }}
                Login User
            {{ end }}
        </title>

        <link rel="stylesheet" href="/assets/fonts/google/plus-jakarta-sans.css">
        <link rel="stylesheet" href="/assets/css/tailwind.css">
        <link href="/assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet" />

        <link rel="stylesheet" href="/assets/css/auth/login.css">
    </head>

    <body>
        <div class="auth-page">
            <header class="auth-topbar">
                <div class="auth-topbar-inner">
                    <div class="auth-brand">
                        <span class="auth-brand-mark">
                            <i class="bx bxs-store-alt"></i>
                        </span>
                        <span class="auth-brand-text">Manna Kampus System</span>
                    </div>

                    <a href="mailto:support@local.internal" class="auth-help">Need Help?</a>
                </div>
            </header>

            <main class="auth-main">
                <section class="auth-card">
                    <div class="auth-badge">
                        <i class="bx bxs-store-alt"></i>
                    </div>

                    <h1 class="auth-title">Asetra <span class="auth-title-accent">Manna Kampus</span></h1>
                    <p class="auth-subtitle">Sistem Operasional Teknis, Procurement & <br> Manajemen Aset</p>

                    {{ if .Error }}
                        <div class="auth-alert">{{ .Error }}</div>
                    {{ end }}

                    <form action="/login" method="post" class="auth-form">
                        

                        <div class="auth-field">
                            <label class="auth-label" for="username">Username Login</label>
                            <div class="auth-input-wrap auth-input-wrap-compact">
                                <span class="auth-input-icon">
                                    <i class="bx bx-user"></i>
                                </span>
                                <input
                                    id="username"
                                    name="username"
                                    type="text"
                                    class="auth-input"
                                    placeholder="Masukkan username Anda"
                                    autocomplete="username"
                                    required
                                >
                            </div>
                        </div>

                        <div class="auth-field">
                            <div class="auth-label-row">
                                <label class="auth-label" for="password">Password</label>
                                <button type="button" class="auth-link-button">Forgot password?</button>
                            </div>
                            <div class="auth-input-wrap auth-input-wrap-compact">
                                <span class="auth-input-icon">
                                    <i class="bx bx-lock-alt"></i>
                                </span>
                                <input
                                    id="password"
                                    name="password"
                                    type="password"
                                    class="auth-input"
                                    placeholder="Masukkan password"
                                    autocomplete="current-password"
                                    required
                                >
                                <button type="button" class="auth-toggle" data-password-toggle aria-label="Tampilkan password" aria-pressed="false">
                                    <i class="bx bx-show"></i>
                                </button>
                            </div>
                        </div>

                        <label class="auth-remember" for="rememberSession">
                            <input type="checkbox" id="rememberSession" name="remember">
                            <span>Remember my login session</span>
                        </label>

                        <button type="submit" class="auth-submit">
                            <span>Masuk</span>
                            <i class="bx bx-log-in-circle"></i>
                        </button>
                    </form>

                    <div class="auth-partners">
                        <p class="auth-partners-label">Created by AhmadRifki 2026</p>
                        <div class="auth-partners-icons" aria-hidden="true">
                            <i class="bx bxs-check-shield"></i>
                            <i class="bx bxs-shield"></i>
                            <i class="bx bx-network-chart"></i>
                        </div>
                    </div>
                </section>
            </main>

            <footer class="auth-footer">
                &copy; 2024 Retail Giant Approval Systems. All rights reserved. Highly Confidential.
            </footer>
        </div>

        <script src="/assets/js/security/csrf.js" defer></script>
        <script src="/assets/js/auth/login.js" defer></script>
    </body>
</html>
